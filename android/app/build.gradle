plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'io.github.kangwang42.superaimail'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'io.github.kangwang42.superaimail'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('SUPERMAIL_SIGN_KEY')) {
                storeFile file(System.getenv('SUPERMAIL_SIGN_KEY'))
                storePassword System.getenv('SUPERMAIL_SIGN_PASSWORD')
                keyAlias 'superaimail'
                keyPassword System.getenv('SUPERMAIL_SIGN_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        if (System.getenv('SUPERMAIL_BUILD_PYTHON')) buildPython(System.getenv('SUPERMAIL_BUILD_PYTHON'))
    }
    sourceSets {
        main {
            srcDir '../..'
            include 'superaimail/**'
        }
    }
}
