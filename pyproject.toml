[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "superaimail"
version = "0.1.1"
description = "Self-hosted, AI-assisted mail for your desktop and phone"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "KangWang42"}]
keywords = ["email", "imap", "ai", "self-hosted"]
dependencies = []

[project.scripts]
superaimail = "superaimail.__main__:main"

[project.urls]
Homepage = "https://github.com/KangWang42/superaimail"
Issues = "https://github.com/KangWang42/superaimail/issues"

[tool.setuptools.packages.find]
include = ["superaimail*"]

[tool.setuptools.package-data]
superaimail = ["web/*"]
